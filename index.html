<style>

  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-txt:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1618; --surf:#172124; --ink:#e3ebea; --muted:#93a5a6; --line:#2a393c;
  --acc:#7fb3c7; --alta:#3f9a66; --media:#c9892a; --baja:#6f7f80; --bon:#0b1416; color-scheme:dark}}

<body>
<header>
  <div><h1>Pasa Andoain</h1><div class="sub" id="estado">Cargando previsión…</div></div>
  <button class="btn" id="act" type="button">Actualizar</button>
</header>
<div class="tabs" role="tablist">
  <button class="tab" role="tab" id="t1" aria-selected="true" data-v="prev">Previsión</button>
  <button class="tab" role="tab" id="t2" aria-selected="false" data-v="ref">Tus 14 días</button>
</div>
<main id="prev"></main>
<main id="ref" hidden></main>
<p class="pie">Datos de Open-Meteo (Landas, Burdeos, Poitiers, Urrugne, Andoain). Las reglas salen de tus 14 días de gran pase y de la bibliografía; son orientativas. Las previsiones a 3 días o más fallan más.</p>

<script>
/* ===== NUCLEO: reglas de pasa (equivale a alerta_pasa.py) ===== */
const LUGARES = {landas:[43.89,-0.50], burdeos:[44.83,-0.70], poitiers:[46.58,0.34],
                 urrugne:[43.37,-1.70], andoain:[43.22,-2.02]};
const VARS = ["pressure_msl","temperature_2m","cloud_cover","wind_speed_10m","wind_direction_10m","precipitation","wind_gusts_10m"];
const ESPECIES = ["paloma","becada","malviz"];
const NOMBRE = {paloma:"Paloma", becada:"Becada", malviz:"Malviz/zorzal"};
const UMBRAL = {alta:75, media:55, parecido:70};
const HORA = 3600000, DIA = 86400000;
const ROSA = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];
const rosa = g => ROSA[Math.round(g/22.5) % 16];
const rad = x => x*Math.PI/180;
const enSector = (a,lo,hi) => (((a-lo)%360+360)%360) <= (((hi-lo)%360+360)%360);
const media = xs => { xs = xs.filter(x => x != null); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
const f0 = x => x.toFixed(0), f1 = x => x.toFixed(1);
const sg1 = x => (x>=0?"+":"") + x.toFixed(1);
const hh = (dia, hora) => dia + hora*HORA;               // dia = ms (UTC naive) de las 00:00
const enCal = (dia, ini, fin) => { const d = new Date(dia), k = (d.getUTCMonth()+1)*100 + d.getUTCDate();
  return k >= ini[0]*100+ini[1] && k <= fin[0]*100+fin[1]; };

function dirVect(vel, ang) {
  let sx = 0, sy = 0;
  vel.forEach((v,i) => { const a = ang[i]; if (v == null || a == null) return;
    sx += v*Math.sin(rad(a)); sy += v*Math.cos(rad(a)); });
  if (sx === 0 && sy === 0) return null;
  return (Math.atan2(sx, sy)*180/Math.PI + 360) % 360;
}
function dirComb(sa, sb) {
  let sx = 0, sy = 0;
  [sa, sb].forEach(s => { sx += s.viento*Math.sin(rad(s.dir)); sy += s.viento*Math.cos(rad(s.dir)); });
  if (sx === 0 && sy === 0) return sa.dir;
  return (Math.atan2(sx, sy)*180/Math.PI + 360) % 360;
}
function construir(t, cols) {
  const D = {t, pos: new Map(t.map((x,i) => [x,i]))};
  VARS.forEach(v => { if (cols[v]) D[v] = cols[v]; });
  return D;
}
function estadisticas(D, a, b) {
  const ii = []; D.t.forEach((t,i) => { if (t >= a && t <= b) ii.push(i); });
  if (ii.length < 4) return null;
  const g = v => ii.map(i => D[v][i]);
  const vel = g("wind_speed_10m"), ang = g("wind_direction_10m");
  const s = {presion: media(g("pressure_msl")), temp: media(g("temperature_2m")),
    nubes: media(g("cloud_cover")), viento: media(vel), dir: dirVect(vel, ang), lluvia: null, racha: null};
  if (D.precipitation) { const ll = g("precipitation").filter(x => x != null);
    if (ll.length) s.lluvia = ll.reduce((p,c)=>p+c,0); }
  if (D.wind_gusts_10m) { const rr = g("wind_gusts_10m").filter(x => x != null);
    if (rr.length) s.racha = Math.max(...rr); }
  if (["presion","temp","nubes","viento","dir"].some(k => s[k] == null)) return null;
  return s;
}
function valor(D, v, t) { const i = D.pos.get(t); return i === undefined ? null : D[v][i]; }
function cambio24(D, v, fin) {
  const a = valor(D, v, fin-24*HORA), b = valor(D, v, fin);
  return (a == null || b == null) ? null : b - a;
}
function sumaLluvia(...st) { const v = st.map(s => s.lluvia).filter(x => x != null);
  return v.length ? v.reduce((p,c)=>p+c,0) : null; }
function crit(texto, ok, max, pts) { return {texto, ok, max, pts: pts == null ? (ok ? max : 0) : pts}; }
function maxRacha(U, A) { const r = [U.racha, A.racha].filter(x => x != null); return r.length ? Math.max(...r) : null; }
function cerrar(c, resumen, nota, limiteCal, claveOk) {
  let total = c.reduce((p,x) => p + x.pts, 0);
  const fuera = limiteCal === false || (nota && nota.startsWith("Fuera"));
  if (fuera) total = Math.min(total, 40);
  if (claveOk === false) total = Math.min(total, 50);
  return {puntos: Math.round(total), criterios: c, resumen, nota};
}
function todos(P, ks, a, b) {
  const S = {};
  for (const k of ks) { S[k] = estadisticas(P[k], a, b); if (!S[k]) return null; }
  return S;
}

function evalPaloma(P, dia) {
  const a = hh(dia,7), b = hh(dia,13);
  const S = todos(P, ["landas","urrugne","andoain"], a, b); if (!S) return null;
  const L = S.landas, U = S.urrugne, A = S.andoain;
  const dE = dirComb(U, A), vE = (U.viento + A.viento)/2, rE = maxRacha(U, A);
  const txtR = rE == null ? "" : `, rachas hasta ${f0(rE)}`;
  const fOk = vE <= 20 && (rE == null || rE <= 40), fMed = vE <= 28 && (rE == null || rE <= 50);
  const p = L.presion;
  const c = [
    crit(`Dirección del viento en Andoain/Urrugne: ${rosa(dE)} (${f0(dE)}°). Bueno: del SE al S (120°-210°)`, enSector(dE,120,210), 25),
    crit(`Dirección del viento en Landas: ${rosa(L.dir)} (${f0(L.dir)}°). Bueno: del E al S (80°-205°)`, enSector(L.dir,80,205), 15),
    crit(`Presión en Landas ${f0(p)} hPa. Buena: ≥ 1017 (parcial ≥ 1010)`, p >= 1017, 25, p >= 1017 ? 25 : (p >= 1010 ? 12 : 0)),
    crit(`FUERZA del viento en Euskadi ${f0(vE)} km/h${txtR}. Bueno: ≤ 20 km/h y rachas ≤ 40 (parcial ≤ 28 y ≤ 50)`, fOk, 15, fOk ? 15 : (fMed ? 7 : 0)),
    crit(`FUERZA del viento en Landas ${f0(L.viento)} km/h. Bueno: ≤ 18 km/h (parcial ≤ 25)`, L.viento <= 18, 10, L.viento <= 18 ? 10 : (L.viento <= 25 ? 5 : 0)),
  ];
  const ll = sumaLluvia(L, U);
  c.push(crit("Lluvia en la ventana: " + (ll == null ? "sin dato" : f1(ll)+" mm") + ". Buena: ≤ 0,5 mm", ll == null || ll <= 0.5, 10));
  const resumen = `viento Andoain ${rosa(dE)} ${f0(vE)} km/h, Landas ${rosa(L.dir)}, ${f0(p)} hPa`;
  const nota = enCal(dia,[10,10],[11,30]) ? null : "Fuera del calendario habitual (10 oct - 30 nov)";
  return cerrar(c, resumen, nota);
}

function evalBecada(P, dia) {
  const a = hh(dia,21), b = hh(dia+DIA,6);
  const S = todos(P, ["landas","burdeos","poitiers","andoain"], a, b); if (!S) return null;
  const fr = [S.landas, S.burdeos, S.poitiers];
  const n = fr.filter(s => enSector(s.dir,340,135)).length;
  const vFr = fr.reduce((p,s)=>p+s.viento,0)/3, tFr = fr.reduce((p,s)=>p+s.temp,0)/3;
  const L = S.landas, dp = cambio24(P.landas, "pressure_msl", b);
  const c = [
    crit(`Viento en Francia (Landas/Burdeos/Poitiers): ${n} de 3 puntos del N al ESE (340°-135°). Landas ${rosa(L.dir)}`, n >= 2, 30, n === 3 ? 30 : (n === 2 ? 20 : 0)),
    crit(`FUERZA del viento medio en Francia ${f0(vFr)} km/h. Bueno: ≤ 15 km/h (parcial ≤ 25)`, vFr <= 15, 20, vFr <= 15 ? 20 : (vFr <= 25 ? 10 : 0)),
    crit(`Temperatura media nocturna en Francia ${f1(tFr)} °C. Buena: ≤ 7 (parcial ≤ 9)`, tFr <= 7, 25, tFr <= 7 ? 25 : (tFr <= 9 ? 10 : 0)),
    crit(`Presión en Landas: ${f0(L.presion)} hPa` + (dp == null ? "" : `, cambio 24 h ${sg1(dp)}`) + ". Buena: bajando ≥ 3 hPa o ≥ 1025",
         (dp != null && dp <= -3) || L.presion >= 1025, 15),
  ];
  const ll = sumaLluvia(L, S.andoain);
  c.push(crit("Lluvia en la noche: " + (ll == null ? "sin dato" : f1(ll)+" mm") + ". Buena: ≤ 1 mm", ll == null || ll <= 1.0, 10));
  const resumen = `Francia viento ${rosa(L.dir)} ${f0(vFr)} km/h, ${f1(tFr)} °C, ${f0(L.presion)} hPa`;
  const nota = enCal(dia,[10,25],[12,20]) ? null : "Fuera del calendario habitual (25 oct - 20 dic)";
  return cerrar(c, resumen, nota);
}

function evalMalviz(P, dia) {
  const a = hh(dia,7), b = hh(dia,13);
  const S = todos(P, ["landas","burdeos","urrugne","andoain"], a, b); if (!S) return null;
  const L = S.landas, B = S.burdeos, U = S.urrugne, A = S.andoain;
  const nubes = (L.nubes + B.nubes)/2;
  const dp = cambio24(P.landas, "pressure_msl", b), dt = cambio24(P.landas, "temperature_2m", b);
  const dE = dirComb(U, A), ll = sumaLluvia(L, U), vE = (U.viento + A.viento)/2, rE = maxRacha(U, A);
  const txtR = rE == null ? "" : `, rachas hasta ${f0(rE)}`;
  const fz = vE <= 30 && (rE == null || rE <= 50);
  const cFuerza = crit(`FUERZA del viento en Euskadi ${f0(vE)} km/h${txtR}. Bueno: ≤ 30 km/h y rachas ≤ 50`, fz, 10);
  const enC = enCal(dia,[10,10],[11,25]);
  const txtDt = "Temperatura en Landas " + (dt == null ? "sin dato" : `${sg1(dt)} °C en 24 h`) + ". Bueno: bajando ≥ 1";
  const cA = [
    crit(`Nubes en Landas/Burdeos ${f0(nubes)} %. Bueno: ≥ 85 %`, nubes >= 85, 25),
    crit("Presión en Landas " + (dp == null ? "sin dato" : `${sg1(dp)} hPa en 24 h`) + ". Bueno: bajando ≥ 3", dp != null && dp <= -3, 30),
    crit(txtDt, dt != null && dt <= -1, 10),
    cFuerza,
    crit("Lluvia en la ventana: " + (ll == null ? "sin dato" : f1(ll)+" mm") + ". Bueno: ≤ 2 mm", ll == null || ll <= 2, 10),
    crit("Dentro del calendario (10 oct - 25 nov)", enC, 15),
  ];
  const cB = [
    crit(`Viento en Landas del ${rosa(L.dir)} (${f0(L.dir)}°). Bueno: del NNO al NE (330°-60°)`, enSector(L.dir,330,60), 35),
    crit(`Viento en Andoain/Urrugne del ${rosa(dE)} (${f0(dE)}°). Bueno: NNO a NE`, enSector(dE,330,60), 25),
    crit(txtDt, dt != null && dt <= -1, 10),
    cFuerza,
    crit("Dentro del calendario (10 oct - 25 nov)", enC, 15),
  ];
  const sum = c => c.reduce((p,x)=>p+x.pts,0);
  let c, patron, resumen, claveOk;
  if (sum(cA) >= sum(cB)) { c = cA; patron = "Patrón A (tus 2 días: nublado y presión bajando)";
    resumen = `nubes ${f0(nubes)} %, presión ` + (dp == null ? "?" : `${sg1(dp)} hPa/24 h`); claveOk = cA[1].ok; }
  else { c = cB; patron = "Patrón B (bibliografía: viento N-NE y frío, sin contrastar)";
    resumen = `viento Landas ${rosa(L.dir)}, Andoain ${rosa(dE)}`; claveOk = cB[0].ok; }
  let nota = patron + ". Solo 2 días de referencia.";
  if (!claveOk) nota += " Falta la condición clave: no pasa de 50.";
  if (!enC) nota += " Fuera del calendario habitual.";
  return cerrar(c, resumen, nota, enC, claveOk);
}

/* --- parecido con los 14 dias de pase --- */
const RASGOS = [
  ["landas.presion",6,2,0],["andoain.presion",6,1,0],["landas.dp",5,2,0],
  ["landas.viento",12,1.5,0],["landas.dir",60,2,1],["andoain.viento",12,1.5,0],["andoain.dir",60,2,1],
  ["landas.nubes",40,1,0],["andoain.nubes",40,1,0],["landas.temp",4,1,0],["burdeos.temp",4,1,0],
  ["burdeos.viento",12,1,0],["burdeos.dir",60,1,1],["poitiers.dir",60,1,1],["poitiers.temp",4,1,0],
];
function rasgos(P, esp, dia) {
  let a, b, lug;
  if (esp === "becada") { a = hh(dia,21); b = hh(dia+DIA,6); lug = ["landas","burdeos","poitiers","andoain"]; }
  else { a = hh(dia,7); b = hh(dia,13); lug = ["landas","burdeos","andoain"]; }
  const f = {};
  for (const k of lug) { if (!P[k]) return null; const s = estadisticas(P[k], a, b); if (!s) return null;
    f[k+".presion"] = s.presion; f[k+".temp"] = s.temp; f[k+".viento"] = s.viento; f[k+".dir"] = s.dir; f[k+".nubes"] = s.nubes; }
  f["landas.dp"] = cambio24(P.landas, "pressure_msl", b);
  return f;
}
function parecido(f1_, f2_) {
  let tot = 0, pes = 0;
  for (const [k, tol, peso, circ] of RASGOS) {
    const x = f1_[k], y = f2_[k]; if (x == null || y == null) continue;
    let d = Math.abs(x - y); if (circ) d = Math.min(d, 360 - d);
    tot += peso*Math.max(0, 1 - d/tol); pes += peso;
  }
  return pes === 0 ? null : 100*tot/pes;
}
function mejorParecido(P, esp, dia, refs) {
  const f = rasgos(P, esp, dia); if (!f) return null;
  let m = null;
  for (const r of refs) { if (r.esp !== esp) continue; const v = parecido(f, r.f);
    if (v != null && (m == null || v > m.pct)) m = {pct: v, fecha: r.fecha}; }
  return m;
}
const nivel = p => p >= UMBRAL.alta ? "alta" : (p >= UMBRAL.media ? "media" : "baja");

function analizar(P, hoy, ahora, nDias, refs) {
  const fun = {paloma:[evalPaloma, d => hh(d,13)], becada:[evalBecada, d => hh(d+DIA,6)], malviz:[evalMalviz, d => hh(d,13)]};
  const res = [];
  for (let k = 0; k <= nDias; k++) {
    const dia = hoy + k*DIA, fila = {dia, k};
    for (const e of ESPECIES) {
      const [f, fin] = fun[e];
      if (fin(dia) < ahora) { fila[e] = null; continue; }
      const r = f(P, dia);
      if (r) {
        r.nivel = nivel(r.puntos);
        r.parecido = refs && refs.length ? mejorParecido(P, e, dia, refs) : null;
        const fuera = r.nota && r.nota.includes("Fuera del calendario");
        if (r.parecido && r.parecido.pct >= UMBRAL.parecido && r.nivel === "baja" && !fuera) {
          r.nivel = "media"; r.nota = (r.nota ? r.nota + " " : "") + "Subida a MEDIA: muy parecido a un día de gran pase."; }
      }
      fila[e] = r;
    }
    res.push(fila);
  }
  return res;
